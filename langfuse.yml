# Langfuse 自托管可观测性栈(与 vector-database.yml 独立)
# 用法: docker compose -f langfuse.yml up -d
# 访问: http://127.0.0.1:4000
# 生成凭据: 项目设置 → API Keys → 创建 PK/SK,填入 .env 的 LANGFUSE_*
# 注意:langfuse:3 需要 web + worker 两个容器(worker 消费 OTel/S3 队列写入 ClickHouse)

# 共享环境配置(web 与 worker 一致),顶层锚点
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
  # langfuse:3 用 REDIS_HOST/PORT 系列(不设 REDIS_AUTH —— 空串会被当密码发送,redis 无密码会拒绝)
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  # ClickHouse 迁移脚本要求以下变量(golang-migrate 用 clickhouse:// 协议 + 原生端口 9000)
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  # 单机模式:走 unclustered 迁移(避免 ON CLUSTER + Zookeeper 依赖)
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  NEXTAUTH_URL: http://127.0.0.1:4000
  # 本地开发占位符,真实值见 %USERPROFILE%\.secrets\langfuse-keys.bak;上线前必须替换为强随机值(openssl rand -hex 32)
  NEXTAUTH_SECRET: change-me-local-dev-only
  SALT: change-me-local-dev-only
  ENCRYPTION_KEY: change-me-local-dev-only
  TELEMETRY_ENABLED: "false"
  # langfuse:3 必填(即使不用 S3 也要占位)
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  # MinIO 凭据(事件/媒体上传)
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

services:
  langfuse-db:
    image: postgres:16
    container_name: langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: langfuse-clickhouse
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: langfuse-minio
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "19000:9000"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:3
    container_name: langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "4000:3000"
    environment:
      <<: *langfuse-env

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env

volumes:
  langfuse-db-data:
  langfuse-clickhouse-data:
  langfuse-minio-data:
